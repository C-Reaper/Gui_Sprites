<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="600"
    viewBox="0 0 800 600"
    fill="none"
>
    <title>SVG Primitive Test</title>
    <desc>Testbild für eine eigene SVG Implementierung in C</desc>

    <!-- Hintergrund -->
    <rect
        x="0"
        y="0"
        width="800"
        height="600"
        fill="#202020"
    />

    <!-- Gruppe -->
    <g
        id="shapes"
        transform="translate(20,20)"
    >

        <!-- Rechteck -->
        <rect
            x="20"
            y="20"
            width="120"
            height="80"
            rx="10"
            ry="10"
            fill="#ff0000"
            stroke="#ffffff"
            stroke-width="3"
        />

        <!-- Kreis -->
        <circle
            cx="220"
            cy="60"
            r="40"
            fill="#00ff00"
            stroke="#ffffff"
            stroke-width="3"
        />

        <!-- Ellipse -->
        <ellipse
            cx="340"
            cy="60"
            rx="70"
            ry="40"
            fill="#0000ff"
            stroke="#ffffff"
            stroke-width="3"
        />

        <!-- Linie -->
        <line
            x1="440"
            y1="20"
            x2="560"
            y2="100"
            stroke="#ffff00"
            stroke-width="5"
        />

        <!-- Polyline -->
        <polyline
            points="580,100 620,20 660,100 700,20"
            fill="none"
            stroke="#00ffff"
            stroke-width="4"
        />

        <!-- Polygon -->
        <polygon
            points="80,150 140,190 120,260 40,260 20,190"
            fill="#ff00ff"
            stroke="#ffffff"
            stroke-width="3"
        />

        <!-- Pfad -->
        <path
            d="
                M 180 150
                L 260 150
                L 280 220
                L 220 270
                L 160 220
                Z
            "
            fill="#ff8800"
            stroke="#ffffff"
            stroke-width="4"
        />

        <!-- Quadratische Bézier-Kurve -->
        <path
            d="M 320 150 Q 380 100 440 150"
            fill="none"
            stroke="#ff0000"
            stroke-width="5"
        />

        <!-- Kubische Bézier-Kurve -->
        <path
            d="M 320 220 C 350 160 410 280 440 220"
            fill="none"
            stroke="#00ff00"
            stroke-width="5"
        />

        <!-- Arc -->
        <path
            d="M 480 220 A 60 40 0 1 1 600 220"
            fill="none"
            stroke="#0000ff"
            stroke-width="5"
        />

        <!-- Text -->
        <text
            x="40"
            y="330"
            font-family="sans-serif"
            font-size="32"
            font-weight="bold"
            fill="#ffffff"
        >
            SVG TEXT
        </text>

        <!-- Text mit Stroke -->
        <text
            x="300"
            y="330"
            font-family="serif"
            font-size="32"
            fill="#ffff00"
            stroke="#ff0000"
            stroke-width="2"
        >
            STROKED
        </text>

        <!-- Rotierte Gruppe -->
        <g
            transform="translate(650,330) rotate(30)"
        >
            <rect
                x="-50"
                y="-30"
                width="100"
                height="60"
                fill="#8844ff"
            />

            <circle
                cx="0"
                cy="0"
                r="15"
                fill="#ffffff"
            />
        </g>

        <!-- Transparenz -->
        <circle
            cx="100"
            cy="430"
            r="60"
            fill="#ff0000"
            fill-opacity="0.5"
        />

        <circle
            cx="150"
            cy="430"
            r="60"
            fill="#0000ff"
            fill-opacity="0.5"
        />

        <!-- Stroke Eigenschaften -->
        <path
            d="M 250 400 L 400 400 L 350 500 L 250 450 Z"
            fill="none"
            stroke="#ffffff"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <!-- Dash -->
        <line
            x1="450"
            y1="420"
            x2="700"
            y2="420"
            stroke="#ffffff"
            stroke-width="6"
            stroke-dasharray="20 10"
            stroke-linecap="round"
        />

        <!-- Fill Rule -->
        <path
            d="
                M 480 470
                L 600 470
                L 600 570
                L 480 570
                Z

                M 510 500
                L 570 500
                L 570 540
                L 510 540
                Z
            "
            fill="#00aa88"
            fill-rule="evenodd"
        />

    </g>
</svg>